document.querySelector('#screens').innerHTML=directions.map((d,i)=>`<section class="screen a v${i} ${i===0?'active':''}"><aside class="sidebar"><div class="logo">${i===0?'<span class="seal">f<span>n</span></span>':i===1?'<svg class="rings" viewBox="0 0 90 90" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><path d="M45 5C72 2 87 30 82 54S52 91 28 77 2 46 13 25 30 4 45 5Z"/><path d="M44 14C66 10 79 33 74 53S50 79 31 69 13 45 21 29 33 13 44 14Z"/><path d="M44 23C61 21 69 37 65 52S47 68 35 61 24 44 30 34 36 24 44 23Z"/><path d="M44 32C54 29 62 42 56 52S35 54 38 43 41 34 44 32Z"/></g></svg>':'<span class="edition-mark">f.</span>'}<span>fieldnote<span class="brand-sub">${['ENGINEERING RECORDS','THE PRACTICE OF PROGRESS','THE ENGINEERING REVIEW'][i]}</span></span></div><div class="nav"><span class="selected">01 &nbsp; Overview</span><span>02 &nbsp; Tasks & attempts</span><span>03 &nbsp; Conventions</span><span>04 &nbsp; After release</span></div><div class="sidefoot">◉ Claude Code + GitHub<br>Workspace / Platform team</div></aside><main class="main"><div class="top"><span>PLATFORM / API-SERVICE ▾</span><span class="pill">Aug 31 – Sep 07, 2026</span></div><div class="eyebrow">${["FIELD REPORT № 036 / AGENT EFFECTIVENESS","THIS WEEK’S GROWTH / AGENT EFFECTIVENESS","VOL. 01 — ISSUE 036 / SEPTEMBER 2026"][i]}</div><h2 class="title">${d.heading}</h2><div class="sub">48 completed tasks · Claude Code · 86% of sessions linked to a PR</div><div class="stats">${[['First-pass CI success','78%','↑ 8 pts vs previous week'],['CI repair cycles','23','↓ 9 vs previous week'],['Cost / delivered task','$4.82','↓ 12% vs previous week'],['Green deployments','94%','16 of 17 deployments']].map(s=>`<div class="stat"><small>${s[0]}</small><div class="value">${s[1]}</div><div class="delta">${s[2]}</div></div>`).join('')}</div><div class="panels"><section class="panel"><div class="panelhead"><span>More tasks pass on the first attempt</span><span>6 WEEKS</span></div>${chart(i===1?'#456d44':i===2?'#174b39':'#193f33')}<div class="legend"><span>● First-pass CI success</span><span style="opacity:.5">┄ Prior period</span></div></section><section class="panel"><div class="eyebrow">Recurring friction / 01</div><div class="insight">${d.insight.replaceAll("\n","<br>")}</div><p class="sub">${d.detail}</p><div style="margin-top:22px;font-size:12px">Explore supporting evidence ↗</div></section></div><div class="table"><div class="row"><span>WHERE TO LOOK NEXT</span><span>EVIDENCE</span><span>SIGNAL</span></div><div class="row"><span>Repository convention checks</span><span>7 violations / 48 tasks</span><span>Test naming · 4 recurring</span></div><div class="row"><span>Review feedback</span><span>12 PRs with changes requested</span><span>Error handling · 5 recurring</span></div><div class="row"><span>After the latest release</span><span>Error rate +0.3 pts</span><span>Investigate · cause unconfirmed</span></div></div></main></section>`).join('');
let current=0;function show(i){current=i;document.querySelectorAll('.screen').forEach((s,n)=>s.classList.toggle('active',n===i));document.querySelectorAll('.tabs button').forEach((s,n)=>{s.classList.toggle('active',n===i);s.setAttribute('aria-pressed',n===i)});document.querySelector('#name').textContent=directions[i].subtitle;document.querySelector('#description').textContent=directions[i].desc;document.querySelector('#principle').textContent=directions[i].principle;document.querySelector('#swatches').innerHTML=directions[i].colors.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('');document.querySelector('#choose').textContent='Keep this direction'}function selectDirection(){document.querySelector('#selection').textContent='Direction selected — tell me what you would refine next.';if(typeof toggleSelect==='function'){let el=document.querySelector('#choose');el.dataset.choice=directions[current].name;toggleSelect(el)}}document.querySelector('.v1 .logo').innerHTML=document.querySelector('.v0 .logo').innerHTML; show(1);

const basePalette={paper:'#F4F7F3',side:'#E6ECE7',card:'#E7EEE8',panel:'#FCFEFA',feature:'#DAE7DF',ink:'#203F36',muted:'#526B60',line:'#C9D8CD'};
const palettes=[
{...basePalette,name:'01 · Keep Current',tag:'The unchanged Current reference.',accent:'#BE421F',selected:'#E6ECE7'},
{...basePalette,name:'02 · Integrated Air Glass',tag:'The page begins in the menu’s exact color, then blends into the soft Air Glass background.',accent:'#BE421F',selected:'#E6ECE7'}];

document.querySelector('.v1 .nav').innerHTML=['Overview','Tasks & attempts','Conventions','After release'].map((t,i)=>`<span class="${i===0?'selected':''}"><b class="navnum">0${i+1}</b>${t}</span>`).join('');
document.querySelector('#palette-tabs').innerHTML=palettes.map((p,i)=>`<button onclick="setPalette(${i})">${p.name}</button>`).join('');
let chosenPalette=0;
function setPalette(i){chosenPalette=i;const p=palettes[i],screen=document.querySelector('.v1');screen.dataset.surface=3;screen.dataset.glass=i===0?0:3;screen.dataset.hybrid=i===1;Object.entries(p).forEach(([k,v])=>{if(v.startsWith('#'))screen.style.setProperty('--'+k,v)});document.querySelectorAll('#palette-tabs button').forEach((b,n)=>{b.classList.toggle('active',n===i);b.setAttribute('aria-pressed',n===i)});document.querySelector('#name').textContent=p.name;document.querySelector('#description').textContent=p.tag+' Same Pine & Mist foundation and typography.';document.querySelector('#swatches').innerHTML=[p.paper,p.side,p.card,p.ink,p.accent].map(c=>`<i style="background:${c}" title="${c}"></i>`).join('');document.querySelector('#principle').textContent='Accent roles: monogram, active navigation, primary action, chart emphasis. Green remains the status color.';document.querySelector('#choose').textContent='Choose '+p.name;const sidebar=screen.querySelector('.sidebar');sidebar.style.color=i===5?'#F4F4E6':'';screen.querySelector('.sidefoot').style.color=i===5?'#D3DFC9':'';screen.querySelectorAll('.sidebar .navnum').forEach(n=>n.style.color=i===5?'#B8CDB2':'');screen.querySelector('.nav .selected .navnum').style.color='var(--muted)';const seal=screen.querySelector('.seal');seal.style.color=i===5?'#DEE8C6':'';seal.style.borderColor=i===5?'#A8BE99':'';screen.querySelectorAll('.chart path[stroke-width="3"],.chart circle').forEach(el=>{if(el.tagName==='circle')el.setAttribute('fill',p.accent);else el.setAttribute('stroke',p.accent)});}
function selectDirection(){document.querySelector('#selection').textContent='Selected '+palettes[chosenPalette].name+' — share your feedback in chat.';if(typeof toggleSelect==='function'){const b=document.querySelector('#choose');b.dataset.choice=palettes[chosenPalette].name;toggleSelect(b)}}
document.querySelector('.v1 .top').insertAdjacentHTML('beforeend','<button class="primary-action" onclick="document.querySelector(\'.v1 .panel:last-child\').scrollIntoView({behavior:\'smooth\',block:\'center\'})">Review this week ↗</button>');
document.querySelector('.v1 .panel:last-child .eyebrow').insertAdjacentHTML('afterbegin','<span class="accent-index">01</span> ');
